name: Mise à jour automatique de l'agenda astronomique

on:
  schedule:
    - cron: "30 17 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_events.py"
      - "data/evenements.json"
      - ".github/workflows/agenda-astro.yml"

permissions:
  contents: write

jobs:
  actualisation:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualiser les phases lunaires (USNO) et les éclipses (IMCCE)
        run: python scripts/update_events.py

      - name: Vérifier la structure et les dates du JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import date

          file = Path("data/evenements.json")
          if not file.exists():
              raise SystemExit(f"Fichier introuvable : {file}")

          with file.open(encoding="utf-8") as stream:
              events = json.load(stream)

          if not isinstance(events, list) or not events:
              raise SystemExit("Le fichier doit contenir une liste non vide.")

          required = ["date", "title", "category", "scope", "summary"]
          seen = set()
          for number, event in enumerate(events, start=1):
              if not isinstance(event, dict):
                  raise SystemExit(f"Événement {number} : format incorrect.")
              missing = [
                  key for key in required
                  if not isinstance(event.get(key), str) or not event[key].strip()
              ]
              if missing:
                  raise SystemExit(
                      f"Événement {number} : champs manquants : {', '.join(missing)}"
                  )
              date.fromisoformat(event["date"])
              if event.get("endDate") is not None:
                  date.fromisoformat(event["endDate"])
                  if event["endDate"] < event["date"]:
                      raise SystemExit(f"Événement {number} : endDate avant date.")
              key = (event["date"], event["title"])
              if key in seen:
                  raise SystemExit(f"Doublon détecté : {key}")
              seen.add(key)

          print(f"OK : {len(events)} événements vérifiés.")
          PY

      - name: Publier les modifications de l'agenda
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evenements.json
          if git diff --cached --quiet; then
            echo "Aucune modification de l'agenda à publier."
          else
            git commit -m "Mise à jour automatique de l'agenda astronomique"
            git push
          fi
