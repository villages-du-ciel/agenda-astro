
name: Vérification hebdomadaire de l'agenda

on:
  schedule:
    - cron: "30 17 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Vérifier les événements JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import date

          file = Path("data/evenements.json")

          if not file.exists():
              raise SystemExit(f"Fichier introuvable : {file}")

          with file.open(encoding="utf-8") as f:
              events = json.load(f)

          if not isinstance(events, list):
              raise SystemExit(
                  "Erreur : le fichier doit contenir une liste d'événements."
              )

          if not events:
              raise SystemExit("Erreur : aucun événement trouvé.")

          required = [
              "date",
              "title",
              "category",
              "scope",
              "summary"
          ]

          for number, event in enumerate(events, start=1):

              if not isinstance(event, dict):
                  raise SystemExit(
                      f"Événement {number} : format incorrect."
                  )

              missing = [
                  key for key in required
                  if not isinstance(event.get(key), str)
                  or not event.get(key).strip()
              ]

              if missing:
                  raise SystemExit(
                      f"Événement {number} : champs manquants : "
                      + ", ".join(missing)
                  )

              try:
                  date.fromisoformat(event["date"])
              except ValueError:
                  raise SystemExit(
                      f"Événement {number} : date invalide : {event['date']}"
                  )

              if event.get("endDate") is not None:
                  try:
                      date.fromisoformat(event["endDate"])
                  except ValueError:
                      raise SystemExit(
                          f"Événement {number} : endDate invalide."
                      )

          print(f"OK : {len(events)} événements vérifiés.")
          print("Structure et dates : valides.")
          PY
